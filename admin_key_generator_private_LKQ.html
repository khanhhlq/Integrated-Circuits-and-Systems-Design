function base64UrlToBytes(str) {

function bytesToBigInt(bytes) {

function bigIntToBytes(num, len) {

function modPow(base, exp, mod) {
  let result = 1n;
  base = base % mod;
  while (exp > 0n) {
    if (exp & 1n) result = (result * base) % mod;
    exp >>= 1n;
    base = (base * base) % mod;

  return result;
}

function expectedPkcs1Block(payloadText) {
